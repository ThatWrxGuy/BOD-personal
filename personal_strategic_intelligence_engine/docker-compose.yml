# =============================================================================
# Personal Strategic Intelligence Engine - Docker Compose
# =============================================================================
# Use this for local development with PostgreSQL and Redis
# =============================================================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: psie-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strategic_board
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for workers
  redis:
    image: redis:7-alpine
    container_name: psie-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
